apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: devops-demo
  namespace: argocd

spec:

  project: default

  source:
    repoURL: https://github.com/zmobarez/devops-demo-gitops.git
    targetRevision: main
    path: manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: devops-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
    - CreateNamespace=true
